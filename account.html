<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Account Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a href="landing.html" class="logo">MyStore</a>
    <nav>
      <ul>
        <li><a href="landing.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html">Shopping Cart</a></li>
        <li><a href="account.html">Account</a></li>
      </ul>
    </nav>
  </div>
</header>

<div class="account-layout">

  
  <h1 id="account-greeting" style="text-align:center;"></h1>

  <nav class="account-tabs">
    <ul>
      <li><a href="#order-history">Order History</a></li>
      <li><a href="#profile-settings">Profile Settings</a></li>
      <li><a href="#wishlist">Wishlist</a></li>
    </ul>
  </nav>

  <hr>


  <h2 id="order-history">Order History</h2>
  <div id="order-list"></div>

  <hr>

  <h2 id="profile-settings">Profile Settings</h2>
  <form class="profile-form">
    <label>Name: <input type="text" id="profile-name" required></label>
    <label>Email: <input type="email" id="profile-email" required></label>
    <label>Password: <input type="password" required></label>
    <button type="submit">Save Changes</button>
  </form>

  <hr>

  <h2 id="wishlist">My Wishlist</h2>
  <div class="product-grid">
    <article>
      <img src="pics/product1.png" alt="Sony Headphones">
      <p>Sony Headphones — $10</p>
      <button class="add-to-cart" data-id="1">Add to Cart</button>
    </article>
    <article>
      <img src="pics/product3.webp" alt="Nintendo Switch">
      <p>Nintendo Switch — $120</p>
      <button class="add-to-cart" data-id="3">Add to Cart</button>
    </article>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
