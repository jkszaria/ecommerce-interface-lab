<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Detail View</title>
</head>
<body>

<header>
  <nav>
    <center>
      <ul>
        <li><a href="landing.html">Home</a></li>
        <li><a href="cart.html">Shopping Cart</a></li>
        <li><a href="account.html">Account</a></li>
      </ul>
    </center>
  </nav>
</header>

<hr>

<!-- A <table> for technical specs/details. -->
<center>
  <h1>Sony Headphones</h1>
  <img src="pics/product1.png" alt="Product Image" width="200">

  <table border="1">
    <tr>
      <th>Feature</th>
      <th>Detail</th>
    </tr>
    <tr>
      <td>Color</td>
      <td>Black</td>
    </tr>
    <tr>
      <td>Size</td>
      <td>Medium</td>
    </tr>
  </table>

  <!-- A <form> to select quantity and "Add to Cart". -->
  <form>
    <label>Quantity:
      <input type="number" min="1" value="1">
    </label>
    <button>Add to Cart</button>
  </form>

<hr>

  <!-- A <section> for user reviews using <blockquote> or <article>. -->
  <h2>User Reviews</h2>
  </center>
  <blockquote>"Excellent product, fast shipping!"</blockquote>
  <blockquote>"Very happy with the quality."</blockquote>


</body>
</html>
