<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Listing View</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a href="landing.html" class="logo">MyStore</a>
    <nav>
      <ul>
        <li><a href="landing.html">Home</a></li>
        <li><a href="cart.html">Shopping Cart</a></li>
        <li><a href="account.html">Account</a></li>
      </ul>
    </nav>
  </div>
</header>

<h1 style="text-align:center; padding: 16px 0 0;">Product Listing</h1>

<div class="products-layout">

  <aside>
    <form>
      <fieldset>
        <legend>Filter by Category</legend>
        <label><input type="checkbox"> Electronics</label><br>
        <label><input type="checkbox"> Clothing</label>
      </fieldset>
      <br>
      <fieldset>
        <legend>Filter by Price</legend>
        <label><input type="radio" name="price"> Low</label><br>
        <label><input type="radio" name="price"> High</label>
      </fieldset>
    </form>
  </aside>

  <main>
  
    <div class="product-grid"></div>
  </main>

</div>


<script src="script.js"></script>
</body>
</html>
